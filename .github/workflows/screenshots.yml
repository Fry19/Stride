name: Screenshots

# Runs the app in the iOS Simulator with sample data, screenshots each screen,
# and force-pushes the images to the `screenshots` branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    name: Take screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          preferred = [p for p in phones if p[1]["name"] == "iPhone 16 Pro"] or phones
          print(sorted(preferred, key=lambda p: p[0])[-1][1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and install
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stride.xcodeproj \
            -scheme Stride \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Stride.app

      - name: Take screenshots
        run: |
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          mkdir -p shots
          shoot() {
            xcrun simctl ui "$UDID" appearance "$3"
            xcrun simctl terminate "$UDID" com.fry19.stride 2>/dev/null || true
            xcrun simctl launch "$UDID" com.fry19.stride -StrideScreen "$2"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
          }
          shoot 1-today today dark
          shoot 2-locker locker dark
          shoot 3-celebration celebration dark
          shoot 4-journey journey dark
          shoot 5-trophies trophies dark
          shoot 6-onboarding onboarding dark
          ls -la shots

      - name: Push to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git add *.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
