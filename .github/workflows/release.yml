name: Release

# Builds an unsigned Stride.ipa for sideloading (SideStore, AltStore, Sideloadly)
# and attaches it to a GitHub release. Runs when a v* tag is pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, like v1.0.1
        required: true

permissions:
  contents: write

jobs:
  ipa:
    name: Build IPA
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Stride.xcarchive \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions

      - name: Package
        run: |
          mkdir Payload
          cp -R build/Stride.xcarchive/Products/Applications/Stride.app Payload/
          # An ad-hoc signature carrying the HealthKit entitlement. Sideloading tools
          # replace it with a signature from your Apple ID.
          codesign --force --sign - --entitlements Config/Stride.entitlements Payload/Stride.app
          codesign --display --entitlements - Payload/Stride.app
          zip -qry "Stride_${TAG#v}.ipa" Payload

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "Stride_${TAG#v}.ipa" \
            --target "$GITHUB_SHA" \
            --title "Stride ${TAG#v}" \
            --notes "Unsigned build for sideloading with SideStore, AltStore or Sideloadly. See the README's \"Install without Xcode\" section."
